<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miki Tech Store — Phones, Cases & Audio</title>
<meta name="description" content="Miki Tech Store — smartphones, protectors, covers and earphones/headphones.">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="grain"></div>

<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <a href="index.html" class="brand">
      <picture>
        <source srcset="assets/logo.webp" type="image/webp">
        <img src="assets/logo.png" alt="Miki Tech Store" class="brand-logo">
      </picture>
    </a>
    <a href="cart.html" class="cart-fab cart-fab--inline" aria-label="View cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3h2l.4 2M7 13h10l3-8H5.4M7 13L5.4 5M7 13l-1.5 4h11" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
      <span class="cart-count" id="cartCountHeader">0</span>
    </a>
  </div>
</header>

<main>

  <section class="hero">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="hero-inner">
      <div class="hero-logo-wrap">
        <div class="hero-logo-glow" aria-hidden="true"></div>
        <picture>
          <source srcset="assets/logo.webp" type="image/webp">
          <img src="assets/logo.png" alt="Miki Tech Store" class="hero-logo">
        </picture>
      </div>
      <p class="hero-tagline">Genuine phones, protectors, covers &amp; audio — <span>at prices that glow.</span></p>
      <a href="#catalog" class="btn btn-primary hero-cta">
        <span>Shop the store</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
    <div class="hero-fade" aria-hidden="true"></div>
  </section>

  <section class="catalog" id="catalog">
    <nav class="tabs" id="tabs" aria-label="Product categories">
      <div class="tabs-track" id="tabsTrack">
        <div class="tab-indicator" id="tabIndicator" aria-hidden="true"></div>
        <button class="tab" data-cat="smartphones" aria-current="true">Smartphones</button>
        <button class="tab" data-cat="protectors">Protectors</button>
        <button class="tab" data-cat="covers">Covers</button>
        <button class="tab" data-cat="earphones">Earphones/Headphones</button>
      </div>
    </nav>

    <div class="product-grid" id="productGrid"></div>
    <p class="empty-state" id="emptyState" hidden>No items in this category yet.</p>
  </section>

</main>

<a href="cart.html" class="cart-fab cart-fab--float" aria-label="View cart" id="cartFabFloat">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3h2l.4 2M7 13h10l3-8H5.4M7 13L5.4 5M7 13l-1.5 4h11" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
  <span class="cart-count" id="cartCountFloat">0</span>
</a>

<div class="toast" id="toast"></div>

<footer class="site-footer">
  <p>Miki Tech Store</p>
</footer>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/home.js"></script>
</body>
</html>
